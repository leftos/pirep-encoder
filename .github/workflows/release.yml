name: Release (rolling latest)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: PirepEncoder-win-x64.exe
            source: PirepEncoder.exe
          - os: ubuntu-latest
            rid: linux-x64
            asset: PirepEncoder-linux-x64
            source: PirepEncoder
          - os: macos-13
            rid: osx-x64
            asset: PirepEncoder-osx-x64
            source: PirepEncoder
          - os: macos-latest
            rid: osx-arm64
            asset: PirepEncoder-osx-arm64
            source: PirepEncoder
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/PirepEncoder -r ${{ matrix.rid }}

      - name: Test
        run: dotnet test --configuration Release --no-restore --verbosity minimal
        if: matrix.rid == 'linux-x64'

      - name: Publish
        run: dotnet publish src/PirepEncoder -c Release -r ${{ matrix.rid }} --no-restore -o publish/${{ matrix.rid }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv "publish/${{ matrix.rid }}/${{ matrix.source }}" "publish/${{ matrix.rid }}/${{ matrix.asset }}"
          chmod +x "publish/${{ matrix.rid }}/${{ matrix.asset }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item "publish/${{ matrix.rid }}/${{ matrix.source }}" "publish/${{ matrix.rid }}/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pirep-encoder-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish rolling "latest"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Show collected artifacts
        run: ls -la dist/

      - name: Replace rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${COMMIT_SHA:0:7}"
          # Remove previous rolling release and its tag (if any). Ignore failure when nothing exists.
          gh release delete latest --yes --cleanup-tag || true
          notes=$(cat <<EOF
          Rolling build from \`main\` at commit [\`${short_sha}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}).

          | Platform | Asset |
          |----------|-------|
          | Windows x64 | \`PirepEncoder-win-x64.exe\` |
          | Linux x64   | \`PirepEncoder-linux-x64\` |
          | macOS x64   | \`PirepEncoder-osx-x64\` |
          | macOS arm64 | \`PirepEncoder-osx-arm64\` |

          All binaries are single-file, self-contained — no .NET runtime required on the target machine. On Unix, \`chmod +x\` before running.
          EOF
          )
          gh release create latest dist/* \
            --title "Latest build (${short_sha})" \
            --notes "$notes" \
            --prerelease \
            --target "${COMMIT_SHA}"
